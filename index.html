<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="借入返済管理（iOS）のサポート・お問い合わせ">
  <title>借入返済管理 — サポート</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0071e3;
      --border: rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --border: rgba(255, 255, 255, 0.12);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
    }
    .wrap {
      max-width: 40rem;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    .card h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 0.75rem;
    }
    .card p { margin: 0 0 0.75rem; }
    .card p:last-child { margin-bottom: 0; }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>借入返済管理</h1>
      <p class="subtitle">iOS アプリ — サポート</p>
    </header>

    <section class="card">
      <h2>お問い合わせ</h2>
      <p>
        不具合のご報告、ご質問、ご要望は、次のメールアドレスまでご連絡ください。
      </p>
      <p>
        <a href="mailto:infomationshunsuke@gmail.com">infomationshunsuke@gmail.com</a>
      </p>
    </section>

    <section class="card">
      <h2>このアプリについて</h2>
      <p>
        借入や返済の情報を、お手持ちの端末内で手入力により整理・記録するためのアプリです。表示内容は入力に基づく目安であり、金融・法律上の助言を行うものではありません。
      </p>
    </section>

    <footer>
      <p>© 借入返済管理</p>
    </footer>
  </div>
</body>
</html>
